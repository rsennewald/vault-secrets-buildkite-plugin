name: "Vault Secrets"
description: "Expose build secrets stored in Vault to your jobs"
author: "@mikeknox, @buildkite-plugins"
public: true
requirements:
  - curl
  - bash
  - vault
  - jq
configuration:
  properties:
    path:
      type: string
    server:
      type: string
    secret:
      type: string
    namespace:
      type: string
    output:
      enum:
        - 'yaml'
        - 'json'
    debug:
      type: boolean
      description: "Enable detailed debug logging to troubleshoot Vault connection issues"
    auth:
      type: object
      properties:
        method:
          enum:
            - 'approle'
            - 'aws'
            - 'jwt'
            - ''
        role-id:
          type: string
        secret-env:
          type: string
        aws-role-name:
          type: string
        jwt-env:
          type: string
        jwt-role:
          type: string
    secrets:
      type: array
      items:
        type: object
        properties:
          path:
            type: string
            description: "Full Vault KV path to the secret"
          fields:
            type: array
            description: "Specific fields to extract (omit to dump all fields as env vars)"
            items:
              type: object
              properties:
                name:
                  type: string
                  description: "Field name within the Vault secret"
                env:
                  type: string
                  description: "Environment variable name to export the field value as"
              required: [ name, env ]
        required: [ path ]
  additionalProperties: false
  required: [ auth ]
    

