name: "Vault Secrets"
description: "Expose build secrets stored in Vault to your jobs"
author: "@mikeknox, @buildkite-plugins"
public: true
requirements:
  - curl
  - bash
  - vault
configuration:
  properties:
    path:
      type: string
    server:
      type: string
    secret:
      type: string
    namespace:
      type: string
    output:
      enum:
        - 'yaml'
        - 'json'
    debug:
      type: boolean
      description: "Enable detailed debug logging to troubleshoot Vault connection issues"
    auth:
      type: object
      properties:
        method:
          enum:
            - 'approle'
            - 'aws'
            - 'jwt'
            - ''
        role-id:
          type: string
        secret-env:
          type: string
        aws-role-name:
          type: string
        aws-credential-name-prefix:
          type: string
          description: "Prefix for AWS credential env vars (e.g. VAULT_AUTH_ reads VAULT_AUTH_AWS_ACCESS_KEY_ID)"
        aws-header-value:
          type: string
          description: "Server ID header value for Vault AWS IAM auth"
        mount:
          type: string
          description: "Vault auth mount point (e.g. zooxlabs). Applies to any auth method."
        aws-vault-sts-role:
          type: string
          description: "Vault AWS secrets engine STS role name for cert-based bootstrap"
        cert-path:
          type: string
          description: "Path to X.509 client certificate for on-prem cert auth"
        cert-key-path:
          type: string
          description: "Path to X.509 client certificate private key"
        cert-mount:
          type: string
          description: "Vault cert auth mount point (default: machine-auth-g1)"
        jwt-env:
          type: string
        jwt-role:
          type: string
    secrets:
      type: array
  additionalProperties: false
  required: [ auth ]
    

